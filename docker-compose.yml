version: '3.1'

services:
  # konga-database:
  #   build: ./konga-database
  #   container_name: konga-database
  #   ports:
  #     - 27017:27017
  #   environment:
  #     - MONGO_INITDB_ROOT_USERNAME=admin
  #     - MONGO_INITDB_ROOT_PASSWORD=ognom
  #   volumes:
  #    - ./db-konga:/data/db
  #   networks:
  #      kong-konga-network:
  #        ipv4_address: 192.168.99.3

  kong-database:
    build: ./kong-database-postgres
    container_name: kong-database
    restart: always
    volumes:
     - ./db-kong:/var/lib/postgresql/data
    privileged: true
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=kong 
      - POSTGRES_DB=kong 
      - POSTGRES_PASSWORD=gonk
    networks:
       kong-konga-network:
         ipv4_address: 192.168.99.4
    # command: ['ls -l /usr/local/bin/docker-entrypoint.sh']


  kong-database-migrations:
    build: ./kong-database-migrations
    container_name: kong-database-migrations
    depends_on:
      - kong-database
    environment: 
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=192.168.99.4
      - KONG_PG_USER=kong
      - KONG_PG_PASSWORD=gonk
      - KONG_CASSANDRA_CONTACT_POINTS=192.168.99.4
    networks:
       kong-konga-network:
         ipv4_address: 192.168.99.5

    command: ["./wait-for-db-and-migrate.sh"]

  kong:
    build: ./kong
    container_name: kong
    depends_on: 
      - kong-database
      - kong-database-migrations
    environment:
      - KONG_DATABASE=postgres
      - KONG_PG_HOST=192.168.99.4
      - KONG_PG_PASSWORD=gonk
      - KONG_CASSANDRA_CONTACT_POINTS=192.168.99.4
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_ADMIN_LISTEN_SSL=0.0.0.0:8444
    ports:
      - 8000:8000
      - 8443:8443
      - 8001:8001
      - 8444:8444
    volumes:
      - ./kong-config:/etc/kong
    networks:
       kong-konga-network:
         ipv4_address: 192.168.99.6

    command: ["./wait-for-stop.sh", "-h", "kong-database-migrations", "--", "kong", "start"]
   
  konga:
    build: ./konga
    container_name: konga
    depends_on:
      - konga-database
      - kong
    ports:
      - 1337:1337
    environment:
      - DB_ADAPTER=postgres # 'mongo','postgres','sqlserver'  or 'mysql'
      - DB_HOST=192.168.99.4
      - DB_PORT=5432 # Defaults to the default db port
      - DB_USER=kong # Omit if not relevant
      - DB_PASSWORD=gonk # Omit if not relevant
      - DB_DATABASE=konga-database # Defaults to 'konga_database'
      - NODE_ENV=production  #  "production" or "development" | defaults to 'development'
    networks:
       kong-konga-network:
         ipv4_address: 192.168.99.7

    #command: ["./wait-for-migrations-kong-and-start.sh"] #关闭@sunny5156

networks:
   kong-konga-network:
      ipam: 
        driver: default
        config:
          - subnet: "192.168.99.0/24"


